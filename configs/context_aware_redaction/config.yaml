# Benchmark Configuration
benchmark:
  name: "Context-Aware Redaction"
  version: "1.0"
  
# Test Configuration
test:
  num_samples: 100  # Number of test samples
  difficulties:
    - short      # Few sentences
    - medium     # Short paragraph
    - long       # Long paragraph
  
# Sensitive Information Types
sensitive_info:
  types:
    - phone
    - id_card
    - credit_card
  
# Data Generation
data_generation:
  output_dir: "data/generated"
  samples_per_difficulty: 50
  gpt_model: "gpt-3.5-turbo"
  temperature: 0.7
  
# Model Configuration
models:
  vllm:
    batch_size: 4
    temperature: 0.6
    top_p: 0.95
    max_tokens: 32768
    gpu_memory_utilization: 0.9
    tensor_parallel_size: 2
    max_model_len: 32768
    enforce_eager: true
    
  api:
    timeout: 1000
    max_retries: 3
    temperature: 0.0
    # max_tokens: 50000
    max_tokens: 6000
    reasoning_effort: "low"  # For o-series models: low/medium/high
    # base_url: "https://api.deepseek.com"  # Optional: custom API endpoint

# Prompt settings
prompt:
  restricted_reasoning: false
    
# Evaluation
evaluation:
  metrics:
    - exact_match
    - precision
    - recall
    - f1_score
    - token_usage  # Track token usage for API models
