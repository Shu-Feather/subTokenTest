# Configuration file for running Qwen2.5-32B-Instruct and DeepSeek-R1-Distill-Qwen-32B with vLLM

test_config:
  # Number of samples per task (can be overridden via --samples)
  # num_samples: 100
  tasks:
    morse_encode: true
    morse_decode: true
    caesar_encode: true
    caesar_decode: true
  caesar_shifts: [1, 3, 5]

models:
  qwen2.5-32b:
    type: vllm
    model_path: /path/to/local/qwen-32b
    model_name: /path/to/local/qwen-32b
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.45
    enforce_eager: true
    batch_size: 4
    max_tokens: 32768
    temperature: 0.6
    top_p: 0.95
    use_chat_template: true
    trust_remote_code: false
    dtype: auto

  deepseek-r1-distill-qwen-32b:
    type: vllm
    model_path: /path/to/local/r1-distill-qwen-32b
    model_name: /path/to/local/r1-distill-qwen-32b
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.45
    enforce_eager: true
    batch_size: 4
    max_tokens: 32768
    temperature: 0.6
    top_p: 0.95
    use_chat_template: true
    trust_remote_code: false
    dtype: auto

evaluation:
  strict_match: true
  case_sensitive: false
  ignore_punctuation: true
  timeout_seconds: 60

prompt_settings:
  default_style: "basic"

output:
  save_results: true
  results_dir: "results"
  detailed_logs: true
  export_formats: ["json", "csv"]
