# Configuration file for cipher & decipher benchmark

# Test configuration
test_config:
  num_samples: 100  # Number of test samples per task
  max_text_length: 200  # Maximum length of generated text
  min_text_length: 10   # Minimum length of generated text
  
  # Task selection (true to enable, false to disable)
  tasks:
    morse_encode: true
    morse_decode: true
    caesar_encode: true
    caesar_decode: true
  
  # Caesar cipher shifts to test
  caesar_shifts: [1, 3, 5, 7, 13, 25]

# Model configurations
models:
  openai:
    api_key: ${OPENAI_API_KEY}
    model_name: "gpt-4"
    max_tokens: 1000
    temperature: 0.0
    timeout: 30
  
  deepseek:
    api_key: ${DEEPSEEK_API_KEY}
    base_url: "https://api.deepseek.com/v1"
    model_name: "deepseek-chat"
    max_tokens: 1000
    temperature: 0.0
    timeout: 30
  
  huggingface:
    model_name: "meta-llama/Llama-2-7b-chat-hf"
    device: "auto"
    max_new_tokens: 1000
    temperature: 0.0
    do_sample: false

# Data generation
data_generation:
  use_llm: true  # Use LLM to generate diverse text samples
  llm_model: "openai"  # Which model to use for text generation
  fallback_texts:  # Fallback texts if LLM generation fails
    - "The quick brown fox jumps over the lazy dog"
    - "Hello world this is a test message"
    - "Artificial intelligence is transforming the world"
    - "Python is a versatile programming language"
    - "Data science combines statistics and computer science"

# Evaluation settings
evaluation:
  strict_match: true  # Require exact match for correct answers
  case_sensitive: false  # Case sensitivity for text comparison
  ignore_punctuation: true  # Ignore punctuation in comparison
  timeout_seconds: 60  # Timeout for each model query

# Prompt settings
prompt_settings:
  # Available styles: 'basic', 'detailed', 'step_by_step'
  default_style: "basic"  # Default prompt style for all tasks
  restricted_reasoning: false  # Encourage minimal reasoning when true
  
  # Per-task prompt styles (optional - overrides default_style)
  # per_task_styles:
  #   morse_encode: "detailed"
  #   morse_decode: "step_by_step"
  #   caesar_encode: "basic"
  #   caesar_decode: "detailed"

# Output settings
output:
  save_results: true
  results_dir: "results"
  detailed_logs: true
  export_formats: ["json", "csv"]
