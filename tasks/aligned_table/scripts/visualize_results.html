<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aligned-Table Benchmark Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            padding: 25px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            background: #667eea;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
            font-weight: 600;
        }

        .file-input-label:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .info-panel {
            flex: 1;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .info-item {
            background: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #dee2e6;
        }

        .info-label {
            font-size: 0.85em;
            color: #6c757d;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 1.2em;
            font-weight: 600;
            color: #495057;
        }

        .filter-controls {
            padding: 20px 30px;
            background: #ffffff;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-weight: 600;
            color: #495057;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 15px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .test-case {
            background: #ffffff;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .test-case:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .test-case-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .test-case-header:hover {
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
        }

        .test-case-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #495057;
        }

        .test-case-meta {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-latex {
            background: #d4edda;
            color: #155724;
        }

        .badge-markdown {
            background: #cce5ff;
            color: #004085;
        }

        .badge-text {
            background: #fff3cd;
            color: #856404;
        }

        .score-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95em;
        }

        .score-excellent {
            background: #28a745;
            color: white;
        }

        .score-good {
            background: #17a2b8;
            color: white;
        }

        .score-fair {
            background: #ffc107;
            color: #212529;
        }

        .score-poor {
            background: #dc3545;
            color: white;
        }

        .test-case-body {
            display: none;
            padding: 25px;
        }

        .test-case-body.active {
            display: block;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #495057;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .prompt-box,
        .response-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .response-box {
            background: #ffffff;
            border: 2px solid #667eea;
        }

        .table-preview {
            background: #ffffff;
            border: 2px solid #28a745;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        .table-preview pre {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            line-height: 1.4;
            margin: 0;
            white-space: pre;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.85em;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: 700;
            color: #495057;
        }

        .toggle-icon {
            transition: transform 0.3s;
        }

        .toggle-icon.active {
            transform: rotate(180deg);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .comparison-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .comparison-panel {
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
        }

        .comparison-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #495057;
        }

        @media (max-width: 768px) {
            .comparison-view {
                grid-template-columns: 1fr;
            }

            .controls,
            .filter-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .test-case-header {
                flex-direction: column;
                gap: 10px;
            }
        }

        .alignment-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .alignment-good {
            background: #d4edda;
            color: #155724;
        }

        .alignment-bad {
            background: #f8d7da;
            color: #721c24;
        }

        .copy-button {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .copy-button:hover {
            background: #5a6268;
        }

        .copy-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Aligned-Table Benchmark Visualizer</h1>
            <p>Visualize and inspect LLM-generated table formatting results</p>
        </div>

        <div class="controls">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept=".json">
                <label for="fileInput" class="file-input-label">
                    📁 Load Results JSON
                </label>
            </div>

            <div class="info-panel" id="infoPanel">
                <div class="info-item">
                    <div class="info-label">Model</div>
                    <div class="info-value" id="modelName">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Total Cases</div>
                    <div class="info-value" id="totalCases">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Avg Score</div>
                    <div class="info-value" id="avgScore">-</div>
                </div>
            </div>
        </div>

        <div class="filter-controls" id="filterControls" style="display: none;">
            <div class="filter-group">
                <label>Format:</label>
                <select id="formatFilter">
                    <option value="all">All Formats</option>
                    <option value="latex">LaTeX</option>
                    <option value="markdown">Markdown</option>
                    <option value="text">Text</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Min Score:</label>
                <input type="number" id="minScoreFilter" min="0" max="1" step="0.1" value="0" style="width: 80px;">
            </div>

            <div class="filter-group">
                <label>Search:</label>
                <input type="text" id="searchFilter" placeholder="Search test cases..." style="width: 200px;">
            </div>

            <div class="filter-group">
                <label>
                    <input type="checkbox" id="showOnlyErrors">
                    Show only errors
                </label>
            </div>
        </div>

        <div class="content" id="content">
            <div class="empty-state">
                <div class="empty-state-icon">📄</div>
                <div class="empty-state-text">No data loaded</div>
                <div>Please load a results JSON file to begin</div>
            </div>
        </div>
    </div>

    <script>
        let currentData = null;
        let allTestCases = [];

        // File input handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        currentData = JSON.parse(event.target.result);
                        loadData(currentData);
                    } catch (error) {
                        alert('Error parsing JSON file: ' + error.message);
                    }
                };
                reader.readAsText(file);
            }
        });

        // Filter handlers
        document.getElementById('formatFilter').addEventListener('change', applyFilters);
        document.getElementById('minScoreFilter').addEventListener('input', applyFilters);
        document.getElementById('searchFilter').addEventListener('input', applyFilters);
        document.getElementById('showOnlyErrors').addEventListener('change', applyFilters);

        function loadData(data) {
            // Update info panel
            document.getElementById('modelName').textContent = data.config.model_name || 'Unknown';
            document.getElementById('totalCases').textContent = data.config.num_test_cases || 0;
            
            if (data.overall_statistics && data.overall_statistics.avg_total_score !== undefined) {
                document.getElementById('avgScore').textContent = data.overall_statistics.avg_total_score.toFixed(3);
            }

            // Show filter controls
            document.getElementById('filterControls').style.display = 'flex';

            // Merge detailed results with responses
            allTestCases = mergeDataSources(data);

            // Display all test cases
            displayTestCases(allTestCases);
        }

        function mergeDataSources(data) {
            const testCases = [];
            const responsesMap = {};

            // Create a map of responses by test_id
            if (data.responses) {
                data.responses.forEach(resp => {
                    responsesMap[resp.test_id] = resp;
                });
            }

            // Merge detailed results with responses
            if (data.detailed_results) {
                data.detailed_results.forEach(result => {
                    const testCase = {
                        ...result,
                        prompt: responsesMap[result.test_id]?.prompt || 'N/A',
                        response: responsesMap[result.test_id]?.response || 'N/A'
                    };
                    testCases.push(testCase);
                });
            }

            return testCases;
        }

        function applyFilters() {
            const formatFilter = document.getElementById('formatFilter').value;
            const minScore = parseFloat(document.getElementById('minScoreFilter').value);
            const searchText = document.getElementById('searchFilter').value.toLowerCase();
            const showOnlyErrors = document.getElementById('showOnlyErrors').checked;

            let filtered = allTestCases.filter(tc => {
                // Format filter
                if (formatFilter !== 'all' && tc.table_format !== formatFilter) {
                    return false;
                }

                // Score filter
                if (tc.total_score < minScore) {
                    return false;
                }

                // Search filter
                if (searchText && !tc.response.toLowerCase().includes(searchText)) {
                    return false;
                }

                // Error filter
                if (showOnlyErrors && !tc.error && tc.total_score >= 0.9) {
                    return false;
                }

                return true;
            });

            displayTestCases(filtered);
        }

        function displayTestCases(testCases) {
            const content = document.getElementById('content');

            if (testCases.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <div class="empty-state-text">No test cases match the current filters</div>
                        <div>Try adjusting your filter settings</div>
                    </div>
                `;
                return;
            }

            content.innerHTML = testCases.map((tc, index) => createTestCaseHTML(tc, index)).join('');

            // Add event listeners for toggle
            document.querySelectorAll('.test-case-header').forEach(header => {
                header.addEventListener('click', function() {
                    const body = this.nextElementSibling;
                    const icon = this.querySelector('.toggle-icon');
                    body.classList.toggle('active');
                    icon.classList.toggle('active');
                });
            });

            // Add copy button listeners
            document.querySelectorAll('.copy-button').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const text = this.getAttribute('data-copy');
                    navigator.clipboard.writeText(text).then(() => {
                        const originalText = this.textContent;
                        this.textContent = '✓ Copied!';
                        setTimeout(() => {
                            this.textContent = originalText;
                        }, 2000);
                    });
                });
            });
        }

        function createTestCaseHTML(tc, index) {
            const formatBadgeClass = `badge-${tc.table_format}`;
            const scoreClass = getScoreClass(tc.total_score);
            const alignmentClass = tc.is_aligned ? 'alignment-good' : 'alignment-bad';
            const alignmentText = tc.is_aligned ? '✓ Aligned' : '✗ Not Aligned';

            // Extract table from response
            const extractedTable = extractTableFromResponse(tc.response);

            return `
                <div class="test-case">
                    <div class="test-case-header">
                        <div class="test-case-title">
                            Test Case #${tc.test_id}
                            <span class="badge ${formatBadgeClass}">${tc.table_format}</span>
                        </div>
                        <div class="test-case-meta">
                            <span class="alignment-indicator ${alignmentClass}">
                                ${alignmentText}
                            </span>
                            <span class="score-badge ${scoreClass}">
                                Score: ${tc.total_score.toFixed(3)}
                            </span>
                            <span class="toggle-icon">▼</span>
                        </div>
                    </div>
                    <div class="test-case-body">
                        ${createStatsSection(tc)}
                        ${createPromptSection(tc)}
                        ${createResponseSection(tc, extractedTable)}
                    </div>
                </div>
            `;
        }

        function createStatsSection(tc) {
            const details = tc.content_details || {};
            return `
                <div class="section">
                    <div class="section-title">📈 Evaluation Metrics</div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Content Score</div>
                            <div class="stat-value" style="color: ${getScoreColor(tc.content_score)};">
                                ${tc.content_score.toFixed(3)}
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Alignment Score</div>
                            <div class="stat-value" style="color: ${getScoreColor(tc.alignment_score)};">
                                ${tc.alignment_score.toFixed(3)}
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Total Score</div>
                            <div class="stat-value" style="color: ${getScoreColor(tc.total_score)};">
                                ${tc.total_score.toFixed(3)}
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Cell Accuracy</div>
                            <div class="stat-value">
                                ${details.correct_cells || 0}/${details.total_cells || 0}
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Row Score</div>
                            <div class="stat-value" style="color: ${getScoreColor(details.row_score || 0)};">
                                ${(details.row_score || 0).toFixed(3)}
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Column Score</div>
                            <div class="stat-value" style="color: ${getScoreColor(details.col_score || 0)};">
                                ${(details.col_score || 0).toFixed(3)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function createPromptSection(tc) {
            return `
                <div class="section">
                    <div class="section-title">📝 Prompt Sent to LLM</div>
                    <div class="prompt-box">${escapeHtml(tc.prompt)}</div>
                    <button class="copy-button" data-copy="${escapeHtml(tc.prompt)}">
                        📋 Copy Prompt
                    </button>
                </div>
            `;
        }

        function createResponseSection(tc, extractedTable) {
            return `
                <div class="section">
                    <div class="section-title">💬 LLM Response (Full)</div>
                    <div class="response-box">${escapeHtml(tc.response)}</div>
                    <button class="copy-button" data-copy="${escapeHtml(tc.response)}">
                        📋 Copy Full Response
                    </button>
                </div>

                ${extractedTable ? `
                    <div class="section">
                        <div class="section-title">✅ Extracted Table (from &lt;answer&gt; tags)</div>
                        <div class="table-preview">
                            <pre>${escapeHtml(extractedTable)}</pre>
                        </div>
                        <button class="copy-button" data-copy="${escapeHtml(extractedTable)}">
                            📋 Copy Table
                        </button>
                    </div>
                ` : `
                    <div class="section">
                        <div class="section-title">⚠️ No Table Found</div>
                        <div style="padding: 20px; background: #fff3cd; border: 2px solid #ffc107; border-radius: 8px;">
                            No content found between &lt;answer&gt; and &lt;/answer&gt; tags
                        </div>
                    </div>
                `}
            `;
        }

        function extractTableFromResponse(response) {
            const match = response.match(/<answer>([\s\S]*?)<\/answer>/);
            return match ? match[1].trim() : null;
        }

        function getScoreClass(score) {
            if (score >= 0.9) return 'score-excellent';
            if (score >= 0.7) return 'score-good';
            if (score >= 0.5) return 'score-fair';
            return 'score-poor';
        }

        function getScoreColor(score) {
            if (score >= 0.9) return '#28a745';
            if (score >= 0.7) return '#17a2b8';
            if (score >= 0.5) return '#ffc107';
            return '#dc3545';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
